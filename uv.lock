    { name = "falcon" },
    { name = "msgspec" },
]

[package.optional-dependencies]
examples = [
    { name = "aiosqlite" },
    { name = "uvicorn" },
    { name = "websocket-client" },
]
testing = [
    { name = "uvicorn" },
    { name = "websockets" },
]

[package.dev-dependencies]
