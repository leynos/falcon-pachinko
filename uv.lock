    { name = "hypothesis" },
    { name = "packaging" },
    { name = "pyright", extra = ["nodejs"] },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-bdd" },
    { name = "pyyaml" },
    { name = "ruff" },
    { name = "uvicorn" },
    { name = "websockets" },
]

[package.metadata]
requires-dist = [
    { name = "aiosqlite", marker = "extra == 'examples'" },
    { name = "falcon", specifier = ">=4,<4.5" },
    { name = "msgspec", specifier = ">=0.18,<1" },
    { name = "uvicorn", marker = "extra == 'examples'", specifier = ">=0.34,<1" },
    { name = "uvicorn", marker = "extra == 'testing'", specifier = ">=0.34,<1" },
    { name = "websocket-client", marker = "extra == 'examples'" },
    { name = "websockets", marker = "extra == 'testing'", specifier = ">=11,<18" },
