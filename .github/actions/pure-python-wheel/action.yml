name: Build pure Python distributions
description: Build an sdist and a wheel from it, then upload both.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory for built distributions
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    default: wheels-pure
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Build sdist and wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        uv build --out-dir "$OUT_DIR"
    - name: Stage distributions
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=("$OUT_DIR"/*.whl "$OUT_DIR"/*.tar.gz)
        mkdir -p release-dist
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No distributions found." >&2
          exit 1
        fi
        if [ "$(realpath "$OUT_DIR")" != "$(realpath release-dist)" ]; then
          cp -- "${files[@]}" release-dist/
        fi
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          release-dist/*.whl
          release-dist/*.tar.gz
        if-no-files-found: error
