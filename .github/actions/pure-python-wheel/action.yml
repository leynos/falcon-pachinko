name: Build Pure Python Wheel
description: Builds a pure Python wheel using UV and uploads it as an artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place built wheel
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
    - name: Build wheel
      shell: bash
      run: uv build --wheel --out-dir ${{ inputs.out-dir }}
    - name: Upload wheel artefact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}/*.whl
