name: Build pure Python distributions
description: Build an sdist and a wheel from it, then upload both.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory for built distributions
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    default: wheels-pure
outputs:
  wheel-name:
    description: File name of the verified wheel
    value: ${{ steps.digests.outputs.wheel-name }}
  wheel-sha256:
    description: SHA-256 digest of the verified wheel
    value: ${{ steps.digests.outputs.wheel-sha256 }}
  sdist-name:
    description: File name of the verified source distribution
    value: ${{ steps.digests.outputs.sdist-name }}
  sdist-sha256:
    description: SHA-256 digest of the verified source distribution
    value: ${{ steps.digests.outputs.sdist-sha256 }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.2"
    - name: Build sdist and wheel
      id: build
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        make release-wheel RELEASE_WHEEL_DIR="$OUT_DIR"
    # Record the identity of the exact files the build produced. Publication
    # jobs compare their downloaded copies against these values, so a later
    # job cannot silently publish a different set of bytes.
    - name: Record distribution digests
      id: digests
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=("$OUT_DIR"/*.whl)
        sdists=("$OUT_DIR"/*.tar.gz)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
          exit 1
        fi
        if [ "${#sdists[@]}" -ne 1 ]; then
          echo "Expected exactly one source distribution, found ${#sdists[@]}." >&2
          exit 1
        fi
        wheel="${wheels[0]}"
        sdist="${sdists[0]}"
        printf 'wheel-name=%s\n' "${wheel##*/}" >> "$GITHUB_OUTPUT"
        printf 'wheel-sha256=%s\n' "$(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        printf 'sdist-name=%s\n' "${sdist##*/}" >> "$GITHUB_OUTPUT"
        printf 'sdist-sha256=%s\n' "$(sha256sum "$sdist" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - name: Stage distributions
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=("$OUT_DIR"/*.whl "$OUT_DIR"/*.tar.gz)
        mkdir -p release-dist
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No distributions found." >&2
          exit 1
        fi
        if [ "$(realpath "$OUT_DIR")" != "$(realpath release-dist)" ]; then
          cp -- "${files[@]}" release-dist/
        fi
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          release-dist/*.whl
          release-dist/*.tar.gz
        if-no-files-found: error
