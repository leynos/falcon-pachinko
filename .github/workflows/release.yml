---
name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  # Queue rather than cancel. A re-pushed tag that cancelled the running
  # release could stop it part-way through an upload. The queued run then
  # starts from a complete state, and the reconciliation below makes it safe to
  # repeat.
  cancel-in-progress: false

# Every job declares exactly what it needs, so nothing inherits a write scope.
permissions: {}

# Each filename's canonical bytes are the ones already published: PyPI's
# first, then an existing asset on the tag's GitHub Release, and this run's
# attested file only when neither has the name. Each destination receives only
# the names it lacks, never overwriting, and `publish-release` checks both hold
# the same digests before the release becomes visible. The decisions live in
# `scripts/release_assets.py`; network calls stay in these steps. YAML anchors
# (`&name`, `*name`) share the steps several jobs repeat verbatim.
jobs:
  # Runs beside the build rather than before it, so the build lane never
  # queues behind a hosted job; every job that attests, uploads, or releases
  # waits on it instead.
  check-version:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.pyproject-version.outputs.prerelease }}
      version: ${{ steps.pyproject-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tag carries the `v` the declared version does not; what remains is
      # compared with the manifest as a string, so `v0.2.0-beta1` matches
      # `0.2.0-beta1` and any other spelling fails.
      - name: Check the pyproject.toml version against the tag
        id: pyproject-version
        run: |
          set -euo pipefail
          python3 scripts/release_version.py

  # The sdist is built first and the wheel from it, so every release proves
  # the sdist is complete. `attest` refuses a run that produced anything other
  # than exactly one sdist, and `ci.yml` runs the same check on every pull
  # request.
  build-wheels:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A local action must already be on disk to be resolved, so the
      # composite's own checkout cannot be the first one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  # Attests exactly the files this run built, before anything leaves the run,
  # and hands them on as one artefact. Bytes a later job carries over from an
  # earlier run were attested by that run, and every run's attestation stays
  # in the repository's attestation store. The bundle is named after the tag
  # alone: a re-run then finds the release already holds that name and uploads
  # nothing, while a name that changed per run would add a new asset each time.
  attest:
    needs:
      - check-version
      - build-wheels
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Sign the build provenance with OIDC.
      attestations: write # Store the provenance in the repository.
    steps:
      - &scripts-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-pure
          path: dist
      - name: Collect release artefacts
        id: collect
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(dist/*)
          sdists=(dist/*.tar.gz)
          wheels=(dist/*.whl)
          if [ "${#sdists[@]}" -ne 1 ] || [ "${#wheels[@]}" -lt 1 ] || [ "${#files[@]}" -ne "$(( ${#sdists[@]} + ${#wheels[@]} ))" ]; then
            echo "Expected exactly one sdist and at least one wheel, with no other files." >&2
            exit 1
          fi
          mkdir -p dist/publish
          mv -- "${files[@]}" dist/publish/
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          cp "${BUNDLE_PATH}" "dist/attestations/falcon-pachinko-${GITHUB_REF_NAME}.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: handoff
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          if-no-files-found: error

  # Creates or reuses the draft and snapshots its assets, so the PyPI job can
  # carry GitHub's bytes over without a GitHub token of its own. A draft is
  # visible only to a token that can write contents.
  draft-release:
    outputs:
      published: ${{ steps.state.outputs.published }}
    needs:
      - check-version
      - attest
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: write # Create or update the GitHub Release and its assets.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *scripts-checkout
      - &release-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create or reuse the draft release
        id: create
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Listing includes drafts and fails closed if the API is unavailable.
          tags=$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name')
          while IFS= read -r tag; do
            if [ "$tag" = "$GITHUB_REF_NAME" ]; then
              echo "Reusing the existing release for ${GITHUB_REF_NAME}."
              exit 0
            fi
          done <<< "$tags"
          flags=(--draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${IS_PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Report release status
        id: state
        run: |
          set -euo pipefail
          draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')
          if [ "$draft" = true ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot the release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          gh release view "${GITHUB_REF_NAME}" --json assets > github-state/assets.json
          python3 -m scripts.release_assets_cli carryover --publish dist/publish \
            --assets github-state/assets.json > github-state/carryover.txt
          while IFS= read -r name; do
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt
      - name: Verify carried asset provenance
        id: carried-provenance
        run: |
          set -euo pipefail
          mkdir -p github-state/provenance
          if [ ! -f github-state/carryover.txt ]; then
            echo "::error::The carried asset list is missing." >&2
            exit 1
          fi
          if [ ! -s github-state/carryover.txt ]; then
            exit 0
          fi
          bundle="falcon-pachinko-${GITHUB_REF_NAME}.sigstore.json"
          if ! gh release download "${GITHUB_REF_NAME}" --pattern "${bundle}" \
            --dir github-state; then
            echo "::warning::The release has no downloadable provenance bundle; differing carried bytes will be rejected."
            exit 0
          fi
          while IFS= read -r name; do
            record="github-state/provenance/${name}.json"
            if ! gh attestation verify "github-state/files/${name}" \
              --bundle "github-state/${bundle}" --repo "${GH_REPO}" \
              --cert-identity "https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
              --source-ref "refs/tags/${GITHUB_REF_NAME}" \
              --source-digest "${GITHUB_SHA}" --format json > "${record}"; then
              rm -f "${record}"
              echo "::warning::Could not verify provenance for ${name}; PyPI staging will reject differing carried bytes."
            fi
          done < github-state/carryover.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: handoff
        with:
          name: release-github-state
          path: github-state
          if-no-files-found: error

  publish-pypi:
    needs:
      - attest
      - draft-release
    # Release orchestration uploads artefacts built on the Ubicloud runners.
    # Keep its placement consistent with the repository's release lanes.
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/falcon-pachinko/
    permissions:
      contents: read
      id-token: write # Authenticate to PyPI using Trusted Publishing.
    steps:
      - *scripts-checkout
      - *release-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-github-state
          path: github-state
      # `publish-release` reuses this script through its anchor. The runner's
      # curl cannot report `%{num_retries}`, so the loop retries a network
      # error, 429, or 5xx itself and counts the attempts. A caller that also
      # sets `EXPECTED_PUBLISH` keeps asking, within the same attempt budget,
      # until the index lists every artefact in that directory: PyPI's CDN can
      # answer 200 with a listing that predates an upload, and that miss is
      # invisible in the status alone.
      - name: Fetch the PyPI index
        id: index
        run: &fetch-index |
          set -euo pipefail
          index_is_current() {
            python3 -m scripts.release_assets_cli index-expected --poll \
              --publish "${EXPECTED_PUBLISH}" --index pypi-index.json
          }
          attempt=0
          status=000
          while [ "${attempt}" -lt 6 ]; do
            attempt=$((attempt + 1))
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output pypi-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://pypi.org/simple/falcon-pachinko/) || status=000
            case "${status}" in
              000|429|5??) [ "${attempt}" -lt 6 ] && sleep 2 ;;
              200|404)
                if [ -z "${EXPECTED_PUBLISH:-}" ] || index_is_current; then
                  break
                fi
                [ "${attempt}" -lt 6 ] && sleep 5
                ;;
              *) break ;;
            esac
          done
          printf 'attempts=%s\nstatus=%s\n' "${attempt}" "${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            200) ;;
            404) echo '{"files": []}' > pypi-index.json ;;
            *)
              echo "PyPI simple index returned HTTP ${status}." >&2
              exit 1
              ;;
          esac
          if [ -n "${EXPECTED_PUBLISH:-}" ]; then
            index_is_current
          fi
      # PyPI rejects a second upload of an existing filename, so names it holds
      # are dropped, and a name only the GitHub Release holds is sent with
      # GitHub's bytes rather than this run's rebuild.
      - name: Skip artefacts already on PyPI
        id: pending
        run: |
          set -euo pipefail
          mkdir -p dist/pypi
          cp -- dist/publish/* dist/pypi/
          python3 -m scripts.release_assets_cli stage-pypi --publish dist/pypi \
            --index pypi-index.json --assets github-state/assets.json \
            --github-files github-state/files --provenance github-state/provenance
      # pypa's action rather than `uv publish`: with Trusted Publishing it also
      # signs and uploads a PEP 740 attestation for every file, which uv does
      # not. `skip-existing` takes the place of uv's `--check-url`, so a file
      # an interrupted earlier attempt already uploaded is skipped, not fatal.
      - name: Publish to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/pypi/
          skip-existing: true
      - name: Wait for PyPI distributions
        env:
          EXPECTED_PUBLISH: dist/publish
        run: *fetch-index

  # Runs only once PyPI holds every artefact, so the release's missing assets
  # take PyPI's bytes, and the release stays a draft unless both destinations
  # then agree.
  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: write # Create or update the GitHub Release and its assets.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *scripts-checkout
      - *release-dist
      # Recorded once, before any staging: the upload decision below compares
      # this against PyPI's post-upload state.
      - name: Note whether the release is a draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' > is-draft
          if [ "$(cat is-draft)" != true ]; then
            echo "The release is already published; nothing will be uploaded." >&2
            echo "is-draft=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "is-draft=true" >> "${GITHUB_OUTPUT}"
      - name: Fetch the PyPI index
        id: index
        env:
          EXPECTED_PUBLISH: dist/publish
        run: *fetch-index
      - name: List the release assets
        id: assets
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
      - name: Stage the assets the release lacks
        id: stage
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli stage-github --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations --output github-upload > pypi-fetch.tsv
          while IFS=$'\t' read -r name url; do
            curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"
          done < pypi-fetch.tsv
      - name: Check the fetched PyPI bytes
        id: fetched
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli check-fetched --publish dist/publish \
            --index pypi-index.json --assets release-assets.json --output github-upload
      # No `--clobber`: an asset the release already holds is canonical. A
      # published release is complete, so a re-run -- which always stages the
      # bundle it built, even when the release already carries that name --
      # uploads nothing and the step succeeds. A draft means either a first
      # run, or one queued behind a complete run whose upload failed: both
      # need the assets they lack.
      - name: Upload the assets the release lacks
        id: upload
        env:
          IS_DRAFT: ${{ steps.draft.outputs.is-draft }}
        run: |
          set -euo pipefail
          if [ "${IS_DRAFT}" != true ]; then
            echo "The release is already published; nothing to upload."
            exit 0
          fi
          shopt -s nullglob
          staged=(github-upload/*)
          if [ "${#staged[@]}" -eq 0 ]; then
            echo "The release holds every artefact this run built."
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${staged[@]}"
      # The digest check compares what PyPI holds *now*, not what it held
      # before this run's upload. One re-read is not enough: PyPI serves the
      # index through a CDN cache, so a 200 can still describe the state
      # before `publish-pypi` uploaded. Ask again, within a fixed budget, until
      # the index lists every name this run staged, so a cache that lags the
      # upload delays the release instead of failing it.
      - name: Re-fetch the PyPI index
        id: index-final
        env:
          EXPECTED_PUBLISH: dist/publish
        run: *fetch-index
      - name: Check both destinations hold the same bytes
        id: verify
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          python3 -m scripts.release_assets_cli verify --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations
          # Verify the release's original attestation, including on a rerun
          # whose rebuild differs. A matching asset name alone proves nothing.
          mkdir -p provenance-check
          bundle="falcon-pachinko-${GITHUB_REF_NAME}.sigstore.json"
          gh release download "${GITHUB_REF_NAME}" --pattern "${bundle}" \
            --dir provenance-check
          for artefact in dist/publish/*; do
            name="${artefact##*/}"
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir provenance-check
          done
          python3 -m scripts.release_assets_cli verify --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations --github-files provenance-check
          for artefact in dist/publish/*; do
            name="${artefact##*/}"
            gh attestation verify "provenance-check/${name}" \
              --bundle "provenance-check/${bundle}" --repo "${GH_REPO}" \
              --cert-identity "https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
              --source-ref "refs/tags/${GITHUB_REF_NAME}" \
              --source-digest "${GITHUB_SHA}"
          done
      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false \
            --prerelease="${IS_PRERELEASE}"
