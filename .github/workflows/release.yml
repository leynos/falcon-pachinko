name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write


jobs:

  pure-wheel:
    # Tag pushes only, so no fork can reach it and the label needs no guard.
    runs-on: ubicloud-standard-2
    # This workflow has no recorded run, so the ceiling is not sized from
    # measured work like the other two. It is set wide deliberately: a
    # release killed part-way is worse than one that runs long.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  release:
    # This project has no C or Rust extensions, so cross-platform
    # builds are unnecessary. Only the pure Python wheel is published.
    needs:
      - pure-wheel
    # Tag pushes only, as above.
    runs-on: ubicloud-standard-2
    # Unmeasured, for the same reason as `pure-wheel`.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Upload wheels to release
        run: |
          set -eu
          find dist/wheels-* -type f -name "*.whl" -print0 | \
            xargs -0 -r gh release upload "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
