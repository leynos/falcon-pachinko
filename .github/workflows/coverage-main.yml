name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage for their own ratchet
# check and nothing else; no workflow a pull request can reach names a
# CodeScene action, runs a `cs-coverage` command or carries
# `CS_ACCESS_TOKEN`. That separation is the estate rule CV-005, and it is
# what keeps a CodeScene outage out of the merge gate: between 2026-09-16
# and 2026-09-18 an unpinned `cs-coverage` could not parse its own
# cobertura output, and every pull request here was blocked on a step with
# nothing to say about the change under review.
#
# Caches saved on main are readable by every pull-request run, so the
# baseline written here is the one PR ratchet checks compare against.

on:
  push:
    branches: [main]
  # A dispatch measures this lane without merging anything. The shared
  # action publishes a baseline only on a push to `refs/heads/main`, so a
  # dispatch reads the caches and writes nothing.
  workflow_dispatch:

# Two pushes to `main` that overlap would both publish. The shared action
# saves a fresh ratchet-baseline cache per successful push and later runs
# restore the newest match, so the older commit finishing last would leave
# its baseline as the one every pull request is then measured against.
# A running generation is never cancelled: one that has started should
# finish. This is not a durable queue: GitHub keeps one pending run per
# group, so a newer push replaces an older pending one, which skips an
# intermediate commit that no pull request should be measured against.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Push-only, so no fork can reach it and the label needs no guard.
    runs-on: ubicloud-standard-2
    # The longest observed run of this job is 34 s.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        with:
          output-path: coverage.xml
          format: cobertura
          # Keep the run serial to match the pull-request coverage job;
          # see the note in ci.yml.
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        # The only CodeScene contact in this repository. The ref guard is
        # load-bearing: `workflow_dispatch` can select any branch or tag, and
        # without it a dispatch from a feature branch would publish that
        # branch's coverage through the main-owned upload. The push trigger's
        # `branches: [main]` says nothing about a dispatch; only this does.
        # The shared action's `publish-baseline: auto` already holds the
        # ratchet baseline to a push to `refs/heads/main`, so this brings the
        # CodeScene report under the same rule.
        #
        # `installer-checksum` is deliberately absent: from shared-actions
        # f68e8e2e the action rejects a non-empty value and pins `cs-coverage`
        # through its own manifest, which is what fixed the parse break.
        if: ${{ github.ref == 'refs/heads/main' && env.CS_ACCESS_TOKEN != '' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        with:
          format: cobertura
          mode: upload
          path: coverage.xml
          access-token: ${{ env.CS_ACCESS_TOKEN }}
