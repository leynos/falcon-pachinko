name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the whole workflow. Every step, including the two
# third-party actions this lane now calls, receives this scope: linting
# Markdown and installing a formatter need to read the checkout and nothing
# else. Declared at workflow level so a job added later inherits it rather
# than silently taking the repository default.
permissions:
  contents: read

jobs:
  lint-test:
    # This lane serves pull requests as well as pushes to `main`. A pull
    # request from a fork cannot obtain an Ubicloud runner, so it falls back
    # to GitHub-hosted compute. A same-repository pull request sets the fork
    # field to `false` and a push leaves it null; both are falsy, so both
    # reach Ubicloud. Keep the continuation at this indent: a deeper one
    # keeps its line break and puts a newline inside the expression, which
    # GitHub evaluates anyway.
    # Dependabot pull requests run on the hosted pool too (free on a public
    # repository). The author is tested, not the actor, which changes when
    # someone else pushes to the branch.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ubicloud runners register as just-in-time self-hosted runners, so
    # GitHub's six-hour limit does not apply and the lane needs its own
    # ceiling. The longest observed run of this job is 36 s; see the runner
    # placement section of the developer guide for the measurements.
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check` with the Git selection and
        # rewrite flags; 0.6.0 is the first release carrying `--check` and
        # `--git`. The action
        # installs a prebuilt release through a hardened cargo-binstall rather
        # than building from source.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          version: "0.6.1"

      # Make provisions PyPy 3.12 and the isolated gate's CPython 3.14 into
      # .uv-python. Keying on the Makefile and PyPy manifest invalidates this
      # cache when either interpreter pin changes.
      - name: Cache PyPy lint interpreter
        uses: actions/cache@v6
        with:
          path: .uv-python
          key: lint-interpreters-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'tools/pypy-downloads.json') }}

      # The Pylint, Astroid, df12, nose-gate and isolated helper-test tools live
      # in .uv-cache. Their pins and PEP 723 metadata are covered by these
      # source and configuration inputs.
      - name: Cache lint tool environments
        uses: actions/cache@v6
        with:
          path: .uv-cache
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'pylintrc-df12.toml', 'tools/pypy-downloads.json', 'pyproject.toml', 'scripts/**') }}

      # A cache hit is checked by `make install-nose` before the gate uses it.
      # The digest manifest and configured version both participate in the key.
      - name: Cache pinned nose release binary
        uses: actions/cache@v6
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'scripts/install_nose.py', 'tools/nose-release-digests.json') }}

      - name: Check spelling
        run: make spelling

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # Pin ruff and ty to the versions the Makefile invokes
          # (RUFF_VERSION and TY_VERSION); the contract test
          # tests/test_toolchain_versions.py enforces that both sites stay
          # in sync. Bump the Makefile and these pins together.
          uv tool install ruff==0.16.4
          uv tool install ty==0.0.74

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      # Runs Ruff, the classic Pylint pass on PyPy, and the df12 pass on
      # CPython 3.14. Each Pylint pass verifies its interpreter first.
      - name: Run linters
        run: make lint

      - name: Test nose duplication gate
        run: make duplication-test

      # Drive the real PyPy and CPython Pylint passes through the Makefile. The
      # tests never skip, so an unprovisioned interpreter fails this step
      # instead of passing it silently.
      - name: Test lint toolchain
        run: uv run pytest -m lint_toolchain -p no:cacheprovider

      - name: Run typechecker
        run: make typecheck

      # The shared CV-005 contract library holds the coverage and CodeScene shape
      # of these workflows; `make test` runs only the repository's own contracts.
      - name: Check the CV-005 contracts
        run: make check-cv005

      # Markdown is linted through the upstream action rather than a `run:`
      # step, because the action's release carries the linter's whole
      # dependency graph: nothing is resolved from the npm registry while the
      # gate is running, so a registry outage or a moved tag cannot change
      # what this lane enforces. The rules and exclusions live in
      # `.markdownlint-cli2.jsonc`, copied verbatim from the estate canon, so
      # the action needs only the glob.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage (and advance the ratchet baseline) via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          output-path: coverage.xml
          format: cobertura
          # The suite previously ran under slipcover with pytest-forked and
          # no xdist; keep it serial to stay behaviour-preserving. Follow-up
          # 4 removes this pin to adopt pytest-xdist once the suite is
          # confirmed xdist-clean. Note: serial mode is in-process, so the
          # fork isolation the old `--forked` run provided is dropped.
          pytest-workers: ''
          # Compare changed-line coverage against the baseline that
          # coverage-main.yml writes on the trunk.
          with-ratchet: 'true'
          # This lane measures and compares; it does not publish. The action
          # archives the report it generated under a step of its own, which
          # no scanner over this file's steps can see, so declining that
          # archive is the only way the boundary is observable here.
          publish-artefact: 'false'

  falcon-minimum:
    # This lane follows the same fork and Dependabot runner routing as the
    # main CI lane. Fork pull requests cannot obtain an Ubicloud runner.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # The uncovered full suite needs more headroom than the measured main CI
    # lane; see the runner placement section of the developer guide.
    timeout-minutes: 30
    env:
      FALCON_MINIMUM_VERSION: "4.0.0"
      UV_PYTHON: '3.13'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1

      - name: Install locked environment
        run: make build

      - name: Install Falcon minimum version
        run: uv pip install "falcon==${FALCON_MINIMUM_VERSION}"

      - name: Verify Falcon minimum version
        run: >-
          uv run --no-sync python -c
          "import importlib.metadata, os, sys; actual =
          importlib.metadata.version('falcon'); expected =
          os.environ['FALCON_MINIMUM_VERSION']; sys.exit(0 if actual == expected else 1)"

      - name: Run full test suite
        run: uv run --no-sync pytest -v
