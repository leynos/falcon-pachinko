name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      UV_PYTHON: '3.13'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so `cs-coverage check` can reach the pull
          # request's merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      # `make lint` runs the classic Pylint checks on PyPy 8.0.0's Python 3.12
      # build, which it provisions into .uv-python from
      # tools/pypy-downloads.json. That manifest names the exact build and its
      # SHA-256, so keying on it means a pin change never restores a stale
      # interpreter.
      - name: Cache PyPy lint interpreter
        uses: actions/cache@v6
        with:
          path: .uv-python
          key: pypy-lint-interpreter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pypy-downloads.json') }}

      # The Pylint, Astroid, and df12-python-lints tool environments live in
      # the Makefile's .uv-cache. Their pins are in the Makefile and the df12
      # rcfile, so the key covers those files as well as the interpreter.
      - name: Cache lint tool environments
        uses: actions/cache@v6
        with:
          path: .uv-cache
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'pylintrc-df12.toml', 'tools/pypy-downloads.json') }}

      - name: Check spelling
        run: make spelling

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # Pin ruff and ty to the versions the Makefile invokes
          # (RUFF_VERSION and TY_VERSION); the contract test
          # tests/test_toolchain_versions.py enforces that both sites stay
          # in sync. Bump the Makefile and these pins together.
          uv tool install ruff==0.16.4
          uv tool install ty==0.0.74
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      # Runs Ruff, the classic Pylint pass on PyPy, and the df12 pass on
      # CPython 3.14. Each Pylint pass verifies its interpreter first.
      - name: Run linters
        run: make lint

      # Drive the real PyPy and CPython Pylint passes through the Makefile. The
      # tests never skip, so an unprovisioned interpreter fails this step
      # instead of passing it silently.
      - name: Test lint toolchain
        run: uv run pytest -m lint_toolchain -p no:cacheprovider

      - name: Run typechecker
        run: make typecheck

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage (and advance the ratchet baseline) via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@e0d9b652b137eb15314fff188f09e1ba18d3cc5b
        with:
          output-path: coverage.xml
          format: cobertura
          # The suite previously ran under slipcover with pytest-forked and
          # no xdist; keep it serial to stay behaviour-preserving. Follow-up
          # 4 removes this pin to adopt pytest-xdist once the suite is
          # confirmed xdist-clean. Note: serial mode is in-process, so the
          # fork isolation the old `--forked` run provided is dropped.
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c3141c3d4cb2a2828d2abbcf3d94b15197740c58
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/68790
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
