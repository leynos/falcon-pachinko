name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.13'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Check spelling
        run: make spelling

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Pull requests compare against the local baseline restored by the
      # shared action. Pushes to main write that baseline and publish coverage
      # through coverage-main.yml.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@e0d9b652b137eb15314fff188f09e1ba18d3cc5b
        with:
          output-path: coverage.xml
          format: cobertura
          # The suite previously ran under slipcover with pytest-forked and
          # no xdist; keep it serial to stay behaviour-preserving. Follow-up
          # 4 removes this pin to adopt pytest-xdist once the suite is
          # confirmed xdist-clean. Note: serial mode is in-process, so the
          # fork isolation the old `--forked` run provided is dropped.
          pytest-workers: ''
          with-ratchet: 'true'
