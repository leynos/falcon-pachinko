name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the whole workflow. Every step, including the two
# third-party actions this lane now calls, receives this scope: linting
# Markdown and installing a formatter need to read the checkout and nothing
# else. Declared at workflow level so a job added later inherits it rather
# than silently taking the repository default.
permissions:
  contents: read

jobs:
  lint-test:
    # This lane serves pull requests as well as pushes to `main`. A pull
    # request from a fork cannot obtain an Ubicloud runner, so it falls back
    # to GitHub-hosted compute; every other event leaves the fork field null
    # and reaches Ubicloud. Keep the continuation at this indent: a deeper one
    # keeps its line break and puts a newline inside the expression, which
    # GitHub evaluates anyway.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ubicloud runners register as just-in-time self-hosted runners, so
    # GitHub's six-hour limit does not apply and the lane needs its own
    # ceiling. The longest observed run of this job is 36 s; see the runner
    # placement section of the developer guide for the measurements.
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the coverage action can reach the pull
          # request's merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git --include-untracked`;
        # 0.6.0 is the first release carrying `--check` and `--git`. The action
        # installs a prebuilt release through a hardened cargo-binstall rather
        # than building from source.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: "0.6.0"

      - name: Check spelling
        run: make spelling

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Markdown is linted through the upstream action rather than a `run:`
      # step, because the action's release carries the linter's whole
      # dependency graph: nothing is resolved from the npm registry while the
      # gate is running, so a registry outage or a moved tag cannot change
      # what this lane enforces. The rules and exclusions live in
      # `.markdownlint-cli2.jsonc`, copied verbatim from the estate canon, so
      # the action needs only the glob.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage (and advance the ratchet baseline) via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@82feb2b7aac45b7efff40c9c4bb632551b14521c
        with:
          output-path: coverage.xml
          format: cobertura
          # The suite previously ran under slipcover with pytest-forked and
          # no xdist; keep it serial to stay behaviour-preserving. Follow-up
          # 4 removes this pin to adopt pytest-xdist once the suite is
          # confirmed xdist-clean. Note: serial mode is in-process, so the
          # fork isolation the old `--forked` run provided is dropped.
          pytest-workers: ''
          # Compare changed-line coverage against the baseline that
          # coverage-main.yml writes on the trunk.
          with-ratchet: 'true'
          # This lane measures and compares; it does not publish. The action
          # archives the report it generated under a step of its own, which
          # no scanner over this file's steps can see, so declining that
          # archive is the only way the boundary is observable here.
          publish-artefact: 'false'
